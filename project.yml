name: WerkRooster
options:
  minimumXcodeGenVersion: 2.39.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nextbuzz.WerkRoosters
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.0

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  WerkRooster:
    type: application
    platform: iOS
    sources:
      - path: WerkRooster
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: WerkRooster/WerkRooster.entitlements
      properties:
        aps-environment: development
    info:
      path: WerkRooster/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WerkRooster
        MARKETING_VERSION: 1.6.0
        CURRENT_PROJECT_VERSION: 6
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
